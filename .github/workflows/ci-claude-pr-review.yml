name: Claude PR Review

concurrency:
  group: ${{ github.event.pull_request.number }}-claude-pr-review
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: chainflip-io/chainflip-reusable-workflows/.github/workflows/_web_claude_pr_review.yml@main
    secrets: inherit
